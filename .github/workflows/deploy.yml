name: Deploy to Production

concurrency:
  group: deploy-main
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    env:
      PM2_HOME: /home/s0iru/.pm2
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start or restart PM2
        run: |
          # Actions starts this script with `set -e`. Sourcing nvm.sh then returns 127
          # (command not found) before Node 24 exists, and the step stops on that line.
          set +e
          export NVM_DIR="$HOME/.nvm"
          NODE_PATH="$(
            set +e
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh" || true
              if type nvm >/dev/null 2>&1; then
                nvm install >&2
                nvm use >&2
                nvm alias default "$(tr -d '[:space:]' < .nvmrc)" >&2
                nvm which current
              fi
            fi
          )"
          set -e
          if [ -n "$NODE_PATH" ] && [ -x "$NODE_PATH" ]; then
            NODE_BIN_DIR="$(dirname "$NODE_PATH")"
          else
            echo "nvm did not select a Node binary (HOME=$HOME)."
            ls -la "$NVM_DIR" 2>&1 || true
            NODE_BIN_DIR="$(dirname "$(command -v node)")"
            VERSION="$("$NODE_BIN_DIR/node" -v)"
            STABLE="$NVM_DIR/versions/node/$VERSION"
            mkdir -p "$NVM_DIR/versions/node"
            ln -sfn "$(cd "$NODE_BIN_DIR/.." && pwd)" "$STABLE"
            NODE_BIN_DIR="$STABLE/bin"
          fi
          export PATH="$NODE_BIN_DIR:$PATH"
          hash -r
          echo "Using $(node -v) at $(command -v node)"
          node -v | grep -q '^v24\.' || { echo "Expected Node 24, got $(node -v)"; exit 1; }
          if ! command -v pm2 >/dev/null 2>&1; then
            npm install -g pm2
          fi
          # Recreate the process so the saved interpreter is Node 24, not the previous Node.
          if pm2 describe vrcsocial >/dev/null 2>&1; then
            pm2 delete vrcsocial
          fi
          pm2 start ecosystem.config.cjs --update-env

      - name: Verify deployment
        run: |
          sleep 3
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001 || true)
          if [ "$code" != "200" ]; then
            echo "Expected 200, got ${code:-none}"
            exit 1
          fi
          if ! command -v pm2 >/dev/null 2>&1; then
            PM2_BIN="$(ls -d "$HOME"/.nvm/versions/node/v*/bin/pm2 2>/dev/null | sort -V | tail -1 || true)"
            if [ -z "$PM2_BIN" ]; then
              echo "pm2 not found"
              exit 1
            fi
          else
            PM2_BIN="$(command -v pm2)"
          fi
          "$PM2_BIN" save
